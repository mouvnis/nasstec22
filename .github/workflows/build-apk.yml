name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🟢 Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install dependencies
      run: npm install

    - name: 🤖 Add Android platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    - name: 🔄 Sync Capacitor
      run: npx cap sync android

    - name: 🎨 Install image tools
      run: |
        pip install Pillow --break-system-packages
        npm install --save-dev @capacitor/assets

    - name: 🖼️ Generate resources from logo
      run: |
        python3 generate_assets.py

    - name: 🚀 Generate icons and splash
      run: |
        npx @capacitor/assets generate \
          --iconBackgroundColor '#0a0a0a' \
          --iconBackgroundColorDark '#0a0a0a' \
          --splashBackgroundColor '#0a0a0a' \
          --splashBackgroundColorDark '#0a0a0a' \
          --assetPath resources \
          --android

    - name: 🔐 Patch AndroidManifest
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"

        # Add permissions
        if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>|' "$MANIFEST"
          echo "Permissions injected"
        fi

        # Add TTS queries block for Android 11+
        if ! grep -q "TTS_SERVICE" "$MANIFEST"; then
          sed -i 's|<application|<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries><application|' "$MANIFEST"
          echo "TTS queries injected"
        fi

    - name: 🛠️ Make gradlew executable
      run: chmod +x android/gradlew

    - name: 🏗️ Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon

    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: nasstec-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: ✅ Done
      run: ls -lh android/app/build/outputs/apk/debug/
