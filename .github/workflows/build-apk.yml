name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🟢 Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install dependencies
      run: npm install

    - name: 🤖 Add Android platform (if not present)
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    - name: 🔄 Sync Capacitor
      run: npx cap sync android

    - name: 🎨 Install image tools
      run: |
        pip install Pillow
        npm install --save-dev @capacitor/assets

    - name: 🖼️ Prepare resources folder from logo.jpg
      run: |
        python3 - << 'EOF'
        from PIL import Image, ImageDraw
        import os
        os.makedirs("resources", exist_ok=True)
        GOLD  = (201, 168, 76)
        BLACK = (10, 10, 10)
        logo = Image.open("www/logo.jpg").convert("RGBA")
        SZ = 1024
        pad = int(SZ * 0.08)
        inner = SZ - 2 * pad
        sm = logo.resize((inner, inner), Image.LANCZOS)
        mask = Image.new("L", (inner, inner), 0)
        ImageDraw.Draw(mask).ellipse([0, 0, inner-1, inner-1], fill=255)
        base = Image.new("RGB", (SZ, SZ), BLACK)
        base.paste(sm.convert("RGB"), (pad, pad), mask)
        out = base.convert("RGBA")
        lw = max(6, SZ // 60)
        ImageDraw.Draw(out).ellipse([lw//2, lw//2, SZ-lw//2-1, SZ-lw//2-1], outline=GOLD, width=lw)
        out.save("resources/icon.png")
        print("icon done")
        W = H = 2732
        splash = Image.new("RGB", (W, H), BLACK)
        d = ImageDraw.Draw(splash)
        cx, cy = W//2, H//2
        for i in range(50, 0, -1):
            t = i/50
            ac = tuple(int(BLACK[c]+(GOLD[c]-BLACK[c])*t*0.20) for c in range(3))
            rp = int(min(W,H)*0.42*t)
            d.ellipse([cx-rp,cy-rp,cx+rp,cy+rp], fill=ac)
        lr = int(min(W,H)*0.28)
        lsq = lr*2
        big = logo.resize((lsq,lsq), Image.LANCZOS)
        cm = Image.new("L",(lsq,lsq),0)
        ImageDraw.Draw(cm).ellipse([0,0,lsq-1,lsq-1],fill=255)
        splash.paste(big.convert("RGB"),(cx-lr,cy-lr),cm)
        lw2 = max(8, lr//20)
        d.ellipse([cx-lr-lw2,cy-lr-lw2,cx+lr+lw2,cy+lr+lw2],outline=GOLD,width=lw2)
        splash.save("resources/splash.png")
        print("splash done")
        EOF

    - name: 🚀 Generate icons and splash
      run: |
        npx @capacitor/assets generate \
          --iconBackgroundColor '#0a0a0a' \
          --iconBackgroundColorDark '#0a0a0a' \
          --splashBackgroundColor '#0a0a0a' \
          --splashBackgroundColorDark '#0a0a0a' \
          --assetPath resources \
          --android

    - name: 🔐 Inject Android permissions
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>|' "$MANIFEST"
          echo "Permissions injected"
        else
          echo "Already present"
        fi

    - name: 🛠️ Make gradlew executable
      run: chmod +x android/gradlew

    - name: 🏗️ Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon

    - name: 📤 Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: nasstec-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
